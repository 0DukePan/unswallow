name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: ESLint (TypeScript)
        run: npm run lint
      - name: Ruff (Python)
        run: python -m pip install --quiet ruff && python -m ruff check packages/python
      - name: TypeScript + Python typechecks
        run: npm run typecheck
      - name: Docs link check
        run: python packages/scripts/check_docs.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Runnable example walkthrough (broken → recovered)
        run: npm run examples
      - name: OpenAI-compatible integration example
        run: npm run integration
      - name: "Benchmark smoke: corpus check + fp-eval gates + parity"
        run: npm run bench:smoke
      - name: CLI smoke test
        run: |
          node packages/unswallow/dist/cli/index.js check > /tmp/unswallow-check.out
          grep -q "SWALLOW DETECTED" /tmp/unswallow-check.out
          node packages/unswallow/dist/cli/index.js matrix > /tmp/unswallow-matrix.out
          grep -q "open-webui" /tmp/unswallow-matrix.out
          grep -q "verified" /tmp/unswallow-matrix.out
          node packages/unswallow/dist/cli/index.js --version | grep -q "^0\.2\.0$"
          node packages/unswallow/dist/cli/index.js check --fixture packages/bench/fixtures/vllm-qwen3-0.19-tool-choice-required-pattern-b.json > /tmp/unswallow-b.out
          grep -q "SWALLOW DETECTED" /tmp/unswallow-b.out
          node packages/unswallow/dist/cli/index.js check --fixture packages/bench/fixtures/fp-guard-discussion-only.json > /tmp/unswallow-fp.out
          grep -q "NO SWALLOW DETECTED" /tmp/unswallow-fp.out

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke test
        shell: bash
        run: |
          node packages/unswallow/dist/cli/index.js check > /tmp/unswallow-check.out
          grep -q "SWALLOW DETECTED" /tmp/unswallow-check.out

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Matrix data must stay in sync with the npm matrix package
        run: |
          python -c "import hashlib, sys
          a = hashlib.sha256(open('packages/matrix/data/engine-matrix.json','rb').read()).hexdigest()
          b = hashlib.sha256(open('packages/python/unswallow/data/engine-matrix.json','rb').read()).hexdigest()
          sys.exit(0 if a == b else 1)"
      - name: Run Python test suite (stdlib-only, no install needed)
        run: python -m unittest discover -s packages/python/tests -t packages/python
      - name: "False-positive evaluation gate (Python)"
        run: python packages/python/bench/fp_eval.py --check
      - name: "Cross-language parity — 22-fixture corpus through the Python core"
        run: python packages/python/bench/parity.py
      - name: Runnable example walkthrough (broken → recovered)
        run: python packages/examples/walkthrough.py
      - name: OpenAI-compatible integration example
        run: python packages/examples/integration_openai.py
      - name: Python CLI smoke
        run: |
          cd packages/python
          python -m unswallow.cli check > /tmp/py-check.out
          grep -q "SWALLOW DETECTED" /tmp/py-check.out
          python -m unswallow.cli matrix > /tmp/py-matrix.out
          grep -q "open-webui" /tmp/py-matrix.out
          grep -q "verified" /tmp/py-matrix.out
          python -c "import unswallow; assert unswallow.__version__ == '0.2.0', unswallow.__version__"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run coverage
      - name: Python coverage
        run: python packages/scripts/coverage_python.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Build npm packages
        run: npm run build --workspace unswallow
      - name: Pack npm artifacts and verify they install
        run: |
          cd packages/unswallow
          npm pack --silent > /tmp/unswallow-tgz.txt
          TGZ=$(tail -1 /tmp/unswallow-tgz.txt)
          cd ../matrix
          npm pack --silent > /tmp/matrix-tgz.txt
          MTGZ=$(tail -1 /tmp/matrix-tgz.txt)
          cd /tmp
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/packages/unswallow/$TGZ" "$GITHUB_WORKSPACE/packages/matrix/$MTGZ"
          node -e "const u = require('unswallow'); const r = u.checkAndRescue({choices:[{finish_reason:'stop',message:{role:'assistant',content:'',reasoning:'<thinking>\n<tool_call>\n{\"name\":\"get_weather\",\"arguments\":{\"city\":\"Tokyo\"}}\n</tool_call>\n</thinking>\n',tool_calls:[]}}]}); if (!r.detected || !r.recovered) { console.error('packed artifact failed smoke check'); process.exit(1); } console.log('npm artifact smoke: detected=' + r.detected + ' recovered=' + r.recovered)"
      - name: Build + verify Python wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir pypi-dist packages/python > /dev/null
          python -m pip install --quiet pypi-dist/*.whl --force-reinstall
          cd /tmp
          python -c "import unswallow; r = unswallow.check_and_rescue({'choices':[{'finish_reason':'stop','message':{'role':'assistant','content':'','reasoning':'<thinking>\n<tool_call>\n{\"name\":\"get_weather\",\"arguments\":{\"city\":\"Tokyo\"}}\n</tool_call>\n</thinking>\n','tool_calls':[]}}]}); assert r.detected and r.recovered, 'wheel smoke failed'; print('python wheel smoke: detected=' + str(r.detected) + ' recovered=' + str(r.recovered))"
