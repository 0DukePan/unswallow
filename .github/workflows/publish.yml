name: Publish

# Tag a release with `git tag vX.Y.Z && git push origin vX.Y.Z` and this
# workflow publishes unswallow-matrix first (dependency order), then
# unswallow (sigstore-provenanced), then the Python port to PyPI, and
# finally opens a draft GitHub Release with changelog notes.
# Required repository secrets: NPM_TOKEN (publish-scoped), PYPI_TOKEN.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # npm provenance (sigstore) requires OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build --workspace unswallow

      - name: Publish unswallow-matrix
        # Skip when the version is already on the registry, so re-running
        # this workflow (or moving a tag) is safe and never double-publishes.
        run: |
          VER="$(node -p "require('./packages/matrix/package.json').version")"
          if npm view "unswallow-matrix@${VER}" version > /dev/null 2>&1; then
            echo "unswallow-matrix@${VER} already published — skipping"
          else
            npm publish --workspace unswallow-matrix --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish unswallow
        run: |
          VER="$(node -p "require('./packages/unswallow/package.json').version")"
          if npm view "unswallow@${VER}" version > /dev/null 2>&1; then
            echo "unswallow@${VER} already published — skipping"
          else
            npm publish --workspace unswallow --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build + publish to PyPI
        run: |
          VER="$(python -c "import tomllib; print(tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['version'])")"
          if curl -fsS "https://pypi.org/pypi/unswallow/${VER}/json" > /dev/null 2>&1; then
            echo "unswallow@${VER} already on PyPI — skipping"
          else
            python -m pip install --quiet build twine
            python -m build --sdist --wheel --outdir pypi-dist packages/python
            python -m twine upload pypi-dist/*
          fi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Open GitHub Release
        # Notes come from CHANGELOG.md, which keeps the changelog as the
        # single source of truth for release prose. The changelog must
        # therefore be updated in the same commit as the version bump.
        # Creates a PUBLISHED release (not a draft): drafts are invisible to
        # anonymous viewers and were repeatedly missed. Idempotent: if a
        # release already exists for the tag (e.g. a leftover draft), it is
        # updated to published instead of failing on 422.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python - <<'PY'
          import re, sys
          ver = "${VER}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[{}].*?(?=^## \[|\Z)".format(re.escape(ver)), text, re.M | re.S)
          body = m.group(0).strip() if m else ""
          if not body:
              print("::warning title=Missing changelog::No CHANGELOG.md entry found for v{} — release will be empty.".format(ver))
          open("release-notes.md", "w", encoding="utf-8").write(body)
          PY
          python - <<'PY'
          import json, os
          notes = open("release-notes.md", encoding="utf-8").read()
          payload = json.dumps({
              "tag_name": os.environ["GITHUB_REF_NAME"],
              "name": os.environ["GITHUB_REF_NAME"],
              "body": notes,
              "draft": False,
          })
          open("release-payload.json", "w", encoding="utf-8").write(payload)
          PY
          TAG="${GITHUB_REF_NAME}"
          echo "Checking for an existing release on ${TAG}..."
          EXISTING="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          RELEASE_ID="$(echo "${EXISTING}" | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)"
          if [ -n "${RELEASE_ID}" ]; then
            echo "Release already exists (id=${RELEASE_ID}) — updating it to published..."
            RESPONSE="$(curl -sS -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -d @release-payload.json)"
          else
            echo "Creating GitHub Release for ${TAG}..."
            RESPONSE="$(curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -d @release-payload.json)"
          fi
          echo "API response: ${RESPONSE}" | head -c 2000
          echo ""
          # Fail loudly if the API did not return a release object with an id.
          echo "${RESPONSE}" | python -c "import json,sys; d=json.load(sys.stdin); assert 'id' in d, 'no release id in API response: %s' % d; print('release ready: id=%s draft=%s html_url=%s' % (d['id'], d.get('draft'), d.get('html_url')))"
        env:
          GH_TOKEN: ${{ github.token }}