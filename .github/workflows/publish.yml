name: Publish

# Tag a release with `git tag vX.Y.Z && git push origin vX.Y.Z` and this
# workflow publishes unswallow-matrix first (dependency order), then
# unswallow (sigstore-provenanced), then the Python port to PyPI, and
# finally opens a draft GitHub Release with changelog notes.
# Required repository secrets: NPM_TOKEN (publish-scoped), PYPI_TOKEN.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # npm provenance (sigstore) requires OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build --workspace unswallow

      - name: Publish unswallow-matrix
        run: npm publish --workspace unswallow-matrix --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish unswallow
        run: npm publish --workspace unswallow --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build + publish to PyPI
        run: |
          python -m pip install --quiet build twine
          python -m build --sdist --wheel --outdir pypi-dist packages/python
          python -m twine upload pypi-dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Open draft GitHub Release
        # Notes come from CHANGELOG.md, which keeps the changelog as the
        # single source of truth for release prose. The changelog must
        # therefore be updated in the same commit as the version bump.
        # Uses the REST API directly (curl) rather than `gh release create` —
        # `gh` is not guaranteed on the runner image, and a missing binary
        # fails silently in a `run:` step that only echoes the command.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python - <<'PY'
          import re, sys
          ver = "${VER}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[{}].*?(?=^## \[|\Z)".format(re.escape(ver)), text, re.M | re.S)
          body = m.group(0).strip() if m else ""
          if not body:
              print("::warning title=Missing changelog::No CHANGELOG.md entry found for v{} — release will be empty.".format(ver))
          open("release-notes.md", "w", encoding="utf-8").write(body)
          PY
          python - <<'PY'
          import json, os
          notes = open("release-notes.md", encoding="utf-8").read()
          payload = json.dumps({
              "tag_name": os.environ["GITHUB_REF_NAME"],
              "name": os.environ["GITHUB_REF_NAME"],
              "body": notes,
              "draft": True,
          })
          open("release-payload.json", "w", encoding="utf-8").write(payload)
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d @release-payload.json
        env:
          GH_TOKEN: ${{ github.token }}