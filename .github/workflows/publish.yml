name: Publish

# Tag a release with `git tag vX.Y.Z && git push origin vX.Y.Z` and this
# workflow publishes unswallow-matrix first (dependency order), then
# unswallow (sigstore-provenanced), then the Python port to PyPI.
# Required repository secrets: NPM_TOKEN (publish-scoped), PYPI_TOKEN.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance (sigstore) requires OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build --workspace unswallow

      - name: Publish unswallow-matrix
        run: npm publish --workspace unswallow-matrix --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish unswallow
        run: npm publish --workspace unswallow --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build + publish to PyPI
        run: |
          python -m pip install --quiet build twine
          python -m build --sdist --wheel --outdir pypi-dist packages/python
          python -m twine upload pypi-dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}