[mypy]
python_version = 3.10
files = packages/python/unswallow
exclude = packages/python/unswallow/data
# The mirror is a 1:1 translation of the TS core with deliberately loose
# internal types; the public API surface is fully annotated.
check_untyped_defs = false
disallow_untyped_calls = false
warn_unused_ignores = true
namespace_packages = true
